# ==========================================================================
# County target list — seed set of high-value vacant-land counties, Eastern US.
#
# Each entry describes ONE county and which sources to run for it. The
# architecture scales to all Eastern US counties: add more blocks here, no code
# change required. `sources` maps a source-type to its config; a source with
# `arcgis_url` gets a live parcel query, others fall back to the generic
# public-notice scrapers or are left as adapters.
#
# NOTE: `arcgis_url` values point at real, publicly published Esri parcel
# services where known. County IT departments occasionally re-home these
# endpoints; each is validated at runtime and a dead endpoint is logged and
# skipped, never fatal. Treat any that 404 as "needs the current URL from the
# county open-data portal" — the scraper tells you which.
# ==========================================================================

defaults:
  # Field-name candidates the parcel normalizer probes (case-insensitive, in
  # order). Different layers name things differently; the scraper reads the
  # live layer metadata and picks the first candidate that exists. The lists
  # include the Florida DOR statewide-cadastral schema (OWN_NAME, OWN_ADDR1,
  # PHY_ADDR1, DOR_UC, LND_SQFOOT, JV/LND_VAL, CO_NO) so the statewide FL
  # source below works out of the box.
  apn_fields:      [APN, PARCELID, PARCEL_ID, PIN, PARCELNO, PARCEL_NUM, GPIN, STRAP, ALTKEY, PRINT_KEY, SBL, LOCALPARCELID, GPIN_LONG]
  owner_fields:    [OWNER, OWNERNME1, OWNER_NAME, OWNERNAME, NAME, OWN_NAME, PRIMARY_OWNER, OWNERNAME1]
  mailing_fields:  [MAILADDR, MAIL_ADDR, OWNERADDR, MAILINGADD, MAIL_ADDRESS, OWN_ADRNO, OWN_ADDR1, MAIL_ADDRESS1, PARCEL_ADDR]
  situs_fields:    [SITEADDR, SITUS, SITUS_ADDR, PROPADDR, LOCATION, PHYADDR, PHY_ADDR1, LOC_ADDR, PARCEL_ADDR]
  # Acreage as a direct acres value...
  acreage_fields:  [ACRES, ACREAGE, GISACRES, DEED_ACRES, CALCACRES, LAND_ACRES, GIS_ACRES, CALC_ACREAGE, CALC_ACRES]
  # ...or, if only land area in square feet is published, derive acres from it.
  acreage_sqft_fields: [LND_SQFOOT, LANDSQFT, LAND_SQFT, SHAPE_AREA_SQFT, GISSQFT]
  landuse_fields:  [LANDUSE, USE_CODE, PROPTYPE, LUCODE, CLASS, PROP_CLASS, DOR_UC, PA_UC, PROPCLASS, LANDUSECOD]
  landval_fields:  [LANDVAL, LAND_VALUE, LNDVALUE, ASSDLAND, LAND_VAL, JV, LND_VAL, LANDAV]
  county_fields:   [COUNTY, CO_NO, COUNTYNAME, CNTY, CO_NAME, COUNTY_NAME, MUNI_NAME, JURISDICTION]

counties:
  # -----------------------------------------------------------------------
  # FLAGSHIP SOURCE — Florida Statewide Cadastral (all 67 counties, one call).
  # Published by FL DOR / FGIO; carries owner, mailing, situs, land-use (DOR_UC),
  # land square-footage, and valuation for every FL parcel. `statewide: true`
  # tells the scraper to read each parcel's own county. The buy-box filter
  # (vacant, 5-100 acres) is applied server- and client-side, so a run returns
  # matching vacant tracts across Florida, not millions of rows.
  # Source: services9.arcgis.com/Gh9awoU677aKree0 (Florida_Statewide_Cadastral)
  # -----------------------------------------------------------------------
  - name: Florida (Statewide)
    state: FL
    fips: "12"
    notes: "All 67 FL counties in one layer; vacant DOR use codes 00/10/40/70."
    sources:
      parcels:
        arcgis_url: "https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest/services/Florida_Statewide_Cadastral/FeatureServer/0"
        statewide: true
        vacant_landuse_codes: ["00", "0000", "10", "40", "70", "99"]

  # -----------------------------------------------------------------------
  # New York — NYS Tax Parcels Public (statewide; the ~38 counties that opted
  # in to public sharing). Property-class codes 3xx = vacant land.
  # Source: gisservices.its.ny.gov  (NYS_Tax_Parcels_Public)
  # -----------------------------------------------------------------------
  - name: New York (Statewide)
    state: NY
    fips: "36"
    notes: "Catskills/upstate recreational land; property class 3xx = vacant."
    sources:
      parcels:
        arcgis_url: "https://gisservices.its.ny.gov/arcgis/rest/services/NYS_Tax_Parcels_Public/FeatureServer/0"
        statewide: true
        vacant_landuse_codes: ["311","312","314","320","321","322","323","330","331","340","341","350","380"]

  # -----------------------------------------------------------------------
  # Virginia — VGIN statewide parcels. The statewide layer has no single
  # uniform land-use code, so we DON'T require the vacant flag here and let the
  # 5-100 acre band be the target signal (predominantly land at that size).
  # Source: gismaps.vdem.virginia.gov  (VA_Base_Layers/VA_Parcels)
  # -----------------------------------------------------------------------
  - name: Virginia (Statewide)
    state: VA
    fips: "51"
    notes: "Statewide parcels; acreage-driven (no uniform state land-use code)."
    sources:
      parcels:
        arcgis_url: "https://vginmaps.vdem.virginia.gov/arcgis/rest/services/VA_Base_Layers/VA_Parcels/FeatureServer/0"
        statewide: true
        require_vacant: false

  # -----------------------------------------------------------------------
  # County-level NON-parcel sources (auction + legal notices). These layer
  # extra distress signals onto parcels the statewide sources already ingest.
  # The FL counties below are covered for parcels by "Florida (Statewide)".
  # -----------------------------------------------------------------------
  - name: Polk
    state: FL
    sources:
      tax_deed_auctions:
        url: "https://www.polk.realtaxdeed.com/"
      legal_notices:
        rss: "https://www.floridapublicnotices.com/rss?county=Polk"

  - name: Marion
    state: FL
    sources:
      tax_deed_auctions:
        url: "https://www.marion.realtaxdeed.com/"

  - name: Charlotte
    state: FL
    notes: "North Port / Port Charlotte legacy platted lots."
    sources:
      tax_deed_auctions:
        url: "https://www.charlotte.realtaxdeed.com/"

  - name: Sullivan
    state: NY
    notes: "Catskills; second-home / recreational land, absentee-heavy."
    sources:
      tax_deed_auctions:
        url: "https://sullivanny.us/Departments/RealPropertyTax"

  # -----------------------------------------------------------------------
  # More Eastern-US states to enable next (GA, NC, SC, PA). Each needs a
  # VERIFIED statewide or county parcel endpoint + that state's vacant land-use
  # codes. Placeholder guesses were removed so runs stay honest; add real
  # endpoints here (same shape as the statewide entries above) as they're
  # confirmed against a live run.
  # -----------------------------------------------------------------------

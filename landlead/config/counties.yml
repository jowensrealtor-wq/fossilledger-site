        arcgis_url: "https://services1.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/Parcels/FeatureServer/0"
        vacant_landuse_codes: ["00", "0000", "10", "40", "99"]
      tax_deed_auctions:
        url: "https://www.marion.realtaxdeed.com/"

  - name: Charlotte
